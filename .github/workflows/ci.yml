name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo ci-fmt
      - run: cargo ci-test
      - run: cargo ci-smoke
      - run: cargo ci-bench-smoke
      - run: cargo ci-clippy

  cli-conformance:
    name: cli conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify protocol fixtures
        run: cargo run --locked -p rivun-cli -- fixtures verify --fixtures fixtures --json
      - name: Validate example domain packs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(examples/domain-packs/*)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "No example domain packs found."
            exit 1
          fi
          for pack in "${packs[@]}"; do
            [ -d "$pack" ] || continue
            cargo run --locked -p rivun-cli -- pack validate --pack "$pack" --json
          done

  website:
    name: website lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --pull --tag rivun:ci .
