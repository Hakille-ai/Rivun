schema_version = 1
id = "zap-pack-smart-building"
name = "Smart Building"
version = "0.1.0"
status = "preview"
description = "Auditable sensor and actuator workflows for commercial smart buildings."

[compatibility]
zap_protocol = ">=0.1.0,<1.0.0"
driver_abi = ">=1,<=2"

[[capabilities]]
id = "sensor.read"
risk = "low"
description = "Read environmental, occupancy, and equipment telemetry from building sensors."

[[capabilities]]
id = "thermostat.setpoint"
risk = "medium"
requires = ["sensor.read"]
description = "Adjust bounded HVAC heating or cooling setpoints for a zone."

[[capabilities]]
id = "light.set"
risk = "medium"
requires = ["sensor.read"]
description = "Set lighting state or brightness for a room, floor, or zone."

[[capabilities]]
id = "lock.open"
risk = "critical"
description = "Open or release an access-controlled door, gate, or lock."

[[capabilities]]
id = "alarm.arm"
risk = "high"
description = "Arm, disarm, or change mode for a building alarm partition."

[[capabilities]]
id = "camera.snapshot"
risk = "high"
description = "Capture a still image from an approved building security camera."

[[policies]]
path = "policies/action-policy.toml"
description = "Baseline fail-closed policy for smart-building actions."

[[schemas]]
path = "schemas/subjects.md"
description = "Pack subject catalog and expected payload shape."
