bind = "127.0.0.1:7101"
key_file = "../../.zap/node-b.key"
require_signed = true

[[peers]]
node_id = "11111111-1111-4111-8111-111111111111"
addr = "127.0.0.1:7100"
public_key = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
transport_key = "4242424242424242424242424242424242424242424242424242424242424242"

[peers.trust]
status = "trusted"
allow_send = true
allow_receive = true
allow_forward = false
allow_poa_attestation = true
labels = ["production-example"]

[[drivers]]
action = "thermostat.setpoint"
path = "../wasm-drivers/thermostat/thermostat.wat"
manifest = "manifests/thermostat.manifest.toml"

[runtime]
fuel = 10000000
timeout_ms = 1000
max_memory_bytes = 16777216
max_output_bytes = 1048576

[security]
max_clock_skew_micros = 300000000
replay_cache_capacity = 4096

[receipts]
dir = "../../.zap/examples/node-b-receipts"

[registry]
path = "registry.index.toml"
require_signature = true
bundle_path = "zapstore-bundle"

[memory]
dir = "../../.zap/examples/node-b-memory"
max_record_bytes = 1048576
allow_driver_read = false
allow_driver_write = false

[capability_policy]
require_grants_for_advertised = true

[[capability_policy.grants]]
capability = "driver.execute:thermostat.setpoint"
reason = "signed thermostat driver approved in production example registry"
