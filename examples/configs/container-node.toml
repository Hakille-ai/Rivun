bind = "0.0.0.0:7000"
key_file = "/var/lib/zap/node.key"
require_signed = true

# Add peers before accepting signed traffic from other nodes.
# [[peers]]
# node_id = "00000000-0000-4000-8000-000000000000"
# addr = "203.0.113.10:7000"
# public_key = "peer-public-key-base64url"
# transport_key = "4242424242424242424242424242424242424242424242424242424242424242"

# Mount production drivers under /opt/zap/drivers and register them here.
# [[drivers]]
# action = "echo"
# path = "/opt/zap/drivers/echo/echo.wat"

[runtime]
fuel = 10000000
timeout_ms = 1000
max_memory_bytes = 16777216
max_output_bytes = 1048576

[security]
max_clock_skew_micros = 300000000
replay_cache_capacity = 4096

[receipts]
dir = "/var/lib/zap/receipts"
