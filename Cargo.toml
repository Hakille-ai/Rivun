[workspace]
members = [
    "crates/rivun-agent",
    "crates/rivun-capability",
    "crates/rivun-cli",
    "crates/rivun-core",
    "crates/rivun-crypto",
    "crates/rivun-driver-sdk",
    "crates/rivun-envelope",
    "crates/rivun-gateway",
    "crates/rivun-journal",
    "crates/rivun-ledger",
    "crates/rivun-machine",
    "crates/rivun-memory",
    "crates/rivun-net",
    "crates/rivun-node",
    "crates/rivun-ops",
    "crates/rivun-pact",
    "crates/rivun-pack",
    "crates/rivun-policy",
    "crates/rivun-router",
    "crates/rivun-runtime",
    "crates/rivun-schema",
    "crates/rivun-store",
    "crates/rivun-telemetry",
    "examples",
    "tests/e2e",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bitflags = "2"
blake3 = "1"
bytes = { version = "1", features = ["serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.7", features = ["async_tokio"] }
ed25519-dalek = { version = "2", features = ["batch", "rand_core"] }
flate2 = "1.0"
hex = "0.4"
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
wasmtime = { version = "45.0.1", default-features = false, features = ["async", "cranelift", "runtime", "std", "wat"] }
wat = "1"
rivun-agent = { path = "crates/rivun-agent" }
rivun-capability = { path = "crates/rivun-capability" }
rivun-gateway = { path = "crates/rivun-gateway" }
rivun-journal = { path = "crates/rivun-journal" }
rivun-memory = { path = "crates/rivun-memory" }
rivun-ops = { path = "crates/rivun-ops" }
rivun-pact = { path = "crates/rivun-pact" }
rivun-pack = { path = "crates/rivun-pack" }
rivun-policy = { path = "crates/rivun-policy" }
rivun-router = { path = "crates/rivun-router" }
rivun-schema = { path = "crates/rivun-schema" }
rivun-telemetry = { path = "crates/rivun-telemetry" }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0

[profile.bench]
debug = true
