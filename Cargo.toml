[workspace]
members = [
    "crates/zap-agent",
    "crates/zap-capability",
    "crates/zap-cli",
    "crates/zap-core",
    "crates/zap-crypto",
    "crates/zap-driver-sdk",
    "crates/zap-envelope",
    "crates/zap-journal",
    "crates/zap-ledger",
    "crates/zap-machine",
    "crates/zap-memory",
    "crates/zap-net",
    "crates/zap-node",
    "crates/zap-ops",
    "crates/zap-pact",
    "crates/zap-policy",
    "crates/zap-router",
    "crates/zap-runtime",
    "crates/zap-schema",
    "crates/zap-store",
    "examples",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bitflags = "2"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
criterion = { version = "0.8", features = ["async_tokio"] }
ed25519-dalek = { version = "2", features = ["batch", "rand_core"] }
hex = "0.4"
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
wasmtime = { version = "45.0.1", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wat = "1"
zap-agent = { path = "crates/zap-agent" }
zap-capability = { path = "crates/zap-capability" }
zap-journal = { path = "crates/zap-journal" }
zap-memory = { path = "crates/zap-memory" }
zap-ops = { path = "crates/zap-ops" }
zap-pact = { path = "crates/zap-pact" }
zap-policy = { path = "crates/zap-policy" }
zap-router = { path = "crates/zap-router" }
zap-schema = { path = "crates/zap-schema" }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0

[profile.bench]
debug = true
