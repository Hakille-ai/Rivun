global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rivun-node
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - node-a.zap.internal:9109
          - node-b.zap.internal:9109
        labels:
          cluster: primary
          environment: production
          data_plane: rivun

rule_files:
  - rivun-rules.yml
