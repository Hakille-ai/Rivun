schema_version = 1

[service]
service_name = "zap-node"
environment = "production"
cluster = "primary"
region = "eu-west"

[service.labels]
team = "platform"
data_plane = "zap"

[metrics]
enabled = true
bind = "0.0.0.0:9109"
path = "/metrics"
scrape_interval_seconds = 15
include_runtime_metrics = true
include_driver_metrics = true

[metrics.labels]
component = "node"

[tracing]
enabled = true
otlp_endpoint = "http://otel-collector:4317"
protocol = "grpc"
sample_ratio = 0.25

[tracing.resource_attributes]
"service.namespace" = "zap"
"deployment.environment" = "production"

[logs]
format = "json"
level = "info"
redact_payloads = true
include_span_ids = true

[health]
stale_after_seconds = 60

[[health.checks]]
name = "node-udp-bind"
severity = "critical"
timeout_ms = 500
interval_seconds = 10
consecutive_failures = 3

[health.checks.target]
kind = "tcp"
addr = "127.0.0.1:7000"

[[health.checks]]
name = "receipt-log-mounted"
severity = "critical"
timeout_ms = 250
interval_seconds = 30
consecutive_failures = 2

[health.checks.target]
kind = "file_exists"
path = "/var/lib/zap/receipts"

[[health.checks]]
name = "registry-bundle-present"
severity = "warning"
timeout_ms = 250
interval_seconds = 60
consecutive_failures = 2

[health.checks.target]
kind = "file_exists"
path = "/var/lib/zap/zapstore-bundle/zapstore.bundle.json"

[[health.checks]]
name = "config-doctor"
severity = "critical"
timeout_ms = 5000
interval_seconds = 60
consecutive_failures = 1

[health.checks.target]
kind = "command"
program = "zap"
args = ["doctor", "--config", "/etc/zap/zap.toml", "--strict", "--json"]
