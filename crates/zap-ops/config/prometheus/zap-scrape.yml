global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zap-node
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - node-a.zap.internal:9109
          - node-b.zap.internal:9109
        labels:
          cluster: primary
          environment: production
          data_plane: zap

rule_files:
  - zap-rules.yml
