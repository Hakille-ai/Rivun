[package]
name = "rivun-cloud-bridge"
description = "Lightweight zero-trust cloud bridge connecting Rivun edge nodes to Rivun Cloud SaaS."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

rivun-core = { path = "../rivun-core" }
rivun-crypto = { path = "../rivun-crypto" }
rivun-ledger = { path = "../rivun-ledger" }
rivun-policy = { path = "../rivun-policy" }
rivun-telemetry = { path = "../rivun-telemetry" }

[dev-dependencies]
tempfile.workspace = true
