[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zap-sdk"
version = "0.1.0"
description = "Lightweight Python SDK for ZAP protocol control envelopes and ZapStore payloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ZAP contributors" }]

[tool.setuptools.packages.find]
where = ["src"]
