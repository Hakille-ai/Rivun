      <circle cx="0" cy="-90" r="5" fill="#00F5D4" />
      <circle cx="78" cy="-45" r="5" fill="#00F5D4" />
      <circle cx="78" cy="45" r="5" fill="#48CAE4" />
      <circle cx="0" cy="90" r="5" fill="#9D4EDD" />
      <circle cx="-78" cy="45" r="5" fill="#48CAE4" />
      <circle cx="-78" cy="-45" r="5" fill="#00F5D4" />
