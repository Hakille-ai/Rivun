    <path d="M 400 370 C 310 240 170 240 170 370 C 170 480 310 480 400 370" fill="none" stroke="url(#mobiusGrad2)" stroke-width="28" stroke-linecap="round" opacity="0.75" />
    <path d="M 400 370 C 490 240 630 240 630 370 C 630 480 490 480 400 370" fill="none" stroke="url(#mobiusGrad1)" stroke-width="28" stroke-linecap="round" opacity="0.85" />
    <path d="M 400 370 C 310 230 160 240 160 370 C 160 490 310 490 400 370 C 490 250 640 250 640 370 C 640 490 490 490 400 370" fill="none" stroke="url(#mobiusGrad1)" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow1)" />
    <path d="M 400 370 C 310 230 160 240 160 370 C 160 490 310 490 400 370 C 490 250 640 250 640 370 C 640 490 490 490 400 370" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow1)" />
  </g>
  <text x="400" y="650" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="14" fill="#FFFFFF" filter="url(#subtleGlow1)">RIVUN</text>
  <text x="400" y="695" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#00F5D4" opacity="0.9">DECENTRALIZED PROTOCOL</text>
