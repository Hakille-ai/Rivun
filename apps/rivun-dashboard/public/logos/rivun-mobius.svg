    <circle cx="400" cy="380" r="120" fill="#7209b7" opacity="0.12" filter="url(#neonGlow1)" />
    <g transform="translate(400, 390)" stroke="url(#latticeGrad1)" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#subtleGlow1)">
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" stroke="#00F5D4" stroke-width="2" fill="#00f5d4" fill-opacity="0.04" />
      <polygon points="0,-90 0,0 78,45 0,90 0,0 -78,45" stroke="#48CAE4" stroke-dasharray="4,4" />
