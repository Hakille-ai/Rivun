      <polygon points="0,0 45,35 45,305 0,340" fill="#00F5D4" opacity="0.4" />
      <polygon points="0,0 22,170 0,340" fill="#FFFFFF" opacity="0.2" />
      <path d="M 45 0 L 140 0 C 205 0 245 40 245 105 C 245 170 205 205 140 205 L 45 205 L 45 155 L 135 155 C 168 155 190 138 190 105 C 190 72 168 50 135 50 L 45 50 Z" fill="url(#neonRGrad)" />
      <path d="M 125 180 L 180 180 L 255 340 L 195 340 Z" fill="url(#neonRGrad)" />
      <polygon points="190,105 245,105 217,65" fill="#00F5D4" opacity="0.8" />
      <polygon points="190,105 245,105 217,145" fill="#4361EE" opacity="0.8" />
      <path d="M 22 20 L 22 320 M 45 25 L 135 25 C 185 25 220 55 220 105 C 220 155 185 180 135 180 L 160 180 L 230 330" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85" />
