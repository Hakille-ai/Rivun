<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="60%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <linearGradient id="neonRGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="35%" stop-color="#00BBF9" />
      <stop offset="75%" stop-color="#4361EE" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0077B6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0.5" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="40" fill="#020306" />
  <g transform="translate(140, 140)">
    <rect width="520" height="520" rx="120" fill="url(#iconBgGlow)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#innerBevel)" />
    <circle cx="260" cy="240" r="140" fill="#00f5d4" opacity="0.09" filter="url(#iconGlow)" />
    <g transform="translate(130, 90)" filter="url(#iconGlow)">
