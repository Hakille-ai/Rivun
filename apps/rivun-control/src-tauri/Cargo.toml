[package]
name = "rivun-control"
description = "Rivun Control — Operator Desktop Station & Secure Local Key Vault for ZAP"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "rivun-control"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

rivun-core = { path = "../../../crates/rivun-core" }
rivun-crypto = { path = "../../../crates/rivun-crypto" }
rivun-policy = { path = "../../../crates/rivun-policy" }
rivun-telemetry = { path = "../../../crates/rivun-telemetry" }
